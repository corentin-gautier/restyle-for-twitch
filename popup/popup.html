<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Restyle for Twitch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Restyle for Twitch</h1>

    <!-- Texts are the English fallback; popup.js replaces them from _locales. -->
    <section>
      <label class="row">
        <span data-i18n="enable">Enable on Twitch</span>
        <input type="checkbox" class="switch" data-key="twitch" />
      </label>
    </section>

    <section>
      <div class="row">
        <span data-i18n="spacing">Spacing</span>
        <div class="segmented" data-segment="space">
          <button type="button" data-value="1" data-i18n="spacingCompact">Compact</button>
          <button type="button" data-value="2" data-i18n="spacingAiry">Airy</button>
          <button type="button" data-value="3" data-i18n="spacingVeryAiry">Very airy</button>
        </div>
      </div>
      <div class="row">
        <span data-i18n="corners">Corners</span>
        <div class="segmented" data-segment="round">
          <button type="button" data-value="0" data-i18n="cornersSquare">Square</button>
          <button type="button" data-value="1" data-i18n="cornersSoft">Soft</button>
          <button type="button" data-value="2" data-i18n="cornersRound">Round</button>
        </div>
      </div>
      <label class="row">
        <span>
          <span data-i18n="floating">Floating panels</span>
          <small data-i18n="floatingHint">Top bar, sidebar and chat off the edges</small>
        </span>
        <input type="checkbox" class="switch" data-key="floating" />
      </label>
      <div class="row">
        <span data-i18n="themes">Themes</span>
        <div class="themes" id="themes"></div>
      </div>
      <div class="row">
        <span data-i18n="accent">Accent colour</span>
        <span class="group">
          <button type="button" class="reset" data-reset="accent" data-i18n="reset">Default</button>
          <input type="color" data-key="accent" data-i18n-label="accent" aria-label="Accent colour" />
        </span>
      </div>
      <div class="row">
        <span data-i18n="background">Background colour</span>
        <span class="group">
          <button type="button" class="reset" data-reset="background" data-i18n="reset">Default</button>
          <input type="color" data-key="background" data-fallback="#0f1012" data-i18n-label="background" aria-label="Background colour" />
        </span>
      </div>
      <label class="row">
        <span>
          <span data-i18n="channelColors">Channel colours</span>
          <small data-i18n="channelColorsHint">On a channel's pages, when they stay readable</small>
        </span>
        <input type="checkbox" class="switch" data-key="channelColors" />
      </label>
    </section>

    <section>
      <label class="row">
        <span>
          <span data-i18n="plainChat">Plain chat</span>
          <small data-i18n="plainChatHint">No badges, no username colours</small>
        </span>
        <input type="checkbox" class="switch" data-key="plainChat" />
      </label>
    </section>

    <section>
      <label class="row">
        <span>
          <span data-i18n="carousel">Home carousel</span>
          <small data-i18n="carouselHint">Featured streams at the top of the home page</small>
        </span>
        <input type="checkbox" class="switch" data-key="carousel" />
      </label>
      <label class="row">
        <span>
          <span data-i18n="stories">Stories</span>
          <small data-i18n="storiesHint">In the sidebar and on Following</small>
        </span>
        <input type="checkbox" class="switch" data-key="stories" />
      </label>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
