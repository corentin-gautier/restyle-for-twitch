# On every version tag: builds the Chrome and Firefox packages, publishes a
# GitHub release with both attached under fixed names (so that
# releases/latest/download/restyle-for-twitch.zip and -firefox.zip always
# point to the newest ones), then submits each package to its store.
#
# A store is skipped while its secrets are not set (see "Releasing" in the
# README), and a failed submission can be re-run on its own without touching
# the release.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the extension
        run: |
          npm ci
          cp "$(./scripts/package.sh)" restyle-for-twitch.zip
          cp "$(./scripts/package.sh firefox)" restyle-for-twitch-firefox.zip
      # Firefox Add-ons asks for the source of anything compiled: the
      # stylesheet is built from Sass.
      - name: Archive the source
        run: git archive --format=zip --output=source.zip HEAD
      # Minor versions are "## [x.y.0]" in the changelog, patches "### [x.y.z]".
      - name: Extract this version's notes from the changelog
        run: |
          awk '/^##?#? \[?[0-9]+\.[0-9]+\.[0-9]+/ { if (seen) exit; seen = 1; next } seen' CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            restyle-for-twitch.zip
            restyle-for-twitch-firefox.zip
            source.zip
            notes.md
          if-no-files-found: error

  github:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" restyle-for-twitch.zip restyle-for-twitch-firefox.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Uploads the package as a new draft, then submits it for review: the store
  # publishes it once the review passes.
  chrome:
    needs: package
    runs-on: ubuntu-latest
    permissions: {}
    env:
      EXTENSION_ID: hecbaaniegkffdanpfelapppfnjlbfbl
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -n "$PUBLISHER_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$REFRESH_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chrome Web Store secrets are not set: submission skipped."
          fi
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.set
        with:
          name: packages
      - name: Submit to the Chrome Web Store
        if: steps.secrets.outputs.set
        run: |
          api=https://chromewebstore.googleapis.com
          item="v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID"

          token=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$token"

          upload=$(curl -sS --fail-with-body -X POST "$api/upload/$item:upload" \
            -H "Authorization: Bearer $token" -T restyle-for-twitch.zip)
          echo "$upload"
          # The store may still be unpacking the zip when the upload returns.
          state=$(echo "$upload" | jq -r .uploadState)
          tries=0
          while [ "${state%IN_PROGRESS}" != "$state" ] && [ "$tries" -lt 30 ]; do
            sleep 10
            tries=$((tries + 1))
            state=$(curl -sS --fail-with-body "$api/$item:fetchStatus" \
              -H "Authorization: Bearer $token" | jq -r .lastAsyncUploadState)
            echo "upload: $state"
          done
          [ "$state" = "SUCCEEDED" ] || { echo "::error::Upload ended as $state"; exit 1; }

          curl -sS --fail-with-body -X POST "$api/$item:publish" \
            -H "Authorization: Bearer $token" -H "Content-Length: 0"

  # Adds the version to the listing on addons.mozilla.org and leaves it to
  # Mozilla's review, without waiting for it.
  firefox:
    needs: package
    runs-on: ubuntu-latest
    permissions: {}
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -n "$WEB_EXT_API_KEY" ] && [ -n "$WEB_EXT_API_SECRET" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Firefox Add-ons secrets are not set: submission skipped."
          fi
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.set
        with:
          name: packages
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.set
        with:
          node-version: 22
      - name: Submit to Firefox Add-ons
        if: steps.secrets.outputs.set
        run: |
          unzip -q restyle-for-twitch-firefox.zip -d extension
          jq -n --rawfile notes notes.md '{ version: { release_notes: { "en-US": $notes } } }' > metadata.json
          npx --yes web-ext@8 sign \
            --source-dir extension \
            --channel listed \
            --upload-source-code source.zip \
            --amo-metadata metadata.json \
            --approval-timeout 0
